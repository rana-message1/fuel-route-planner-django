<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --ink: #1f2933; --muted: #616e7c; --line: #d9e2ec; --accent: #0b6e4f; --bg: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 10px; font-size: 18px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    input { flex: 1 1 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    main { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 100px); }
    #map { height: 100%; }
    aside { overflow-y: auto; padding: 14px 16px; background: #fff; border-left: 1px solid var(--line); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
    .stat b { display: block; font-size: 17px; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .error { color: #b42318; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 55vh; } aside { border-left: 0; } }
  </style>
</head>
<body>
<header>
  <h1>Fuel Route Planner</h1>
  <form id="plan-form">
    <input id="start" name="start_location" value="New York, NY" aria-label="Start location" required>
    <input id="finish" name="finish_location" value="Los Angeles, CA" aria-label="Finish location" required>
    <button id="submit" type="submit">Plan route</button>
  </form>
</header>
<main>
  <div id="map"></div>
  <aside id="panel"><p class="muted">Enter two US locations ("City, ST") and plan the trip.</p></aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const API_URL = "{% url 'route-plan' %}";
  const map = L.map("map").setView([39.5, -98.35], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  const panel = document.getElementById("panel");
  const money = (v) => v.toLocaleString("en-US", { style: "currency", currency: "USD" });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function decodePolyline(str, precision = 5) {
    const factor = Math.pow(10, precision), coords = [];
    let index = 0, lat = 0, lng = 0;
    while (index < str.length) {
      for (const which of [0, 1]) {
        let result = 0, shift = 0, byte;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
        if (which === 0) lat += delta; else lng += delta;
      }
      coords.push([lat / factor, lng / factor]);
    }
    return coords;
  }

  function render(data) {
    layer.clearLayers();
    const line = L.polyline(decodePolyline(data.route.geometry), { color: "#1d4ed8", weight: 4 }).addTo(layer);
    L.circleMarker([data.start_coordinates.latitude, data.start_coordinates.longitude], { radius: 8, color: "#0b6e4f", fillOpacity: 1 })
      .bindPopup("Start: " + esc(data.start_location)).addTo(layer);
    L.circleMarker([data.finish_coordinates.latitude, data.finish_coordinates.longitude], { radius: 8, color: "#b42318", fillOpacity: 1 })
      .bindPopup("Finish: " + esc(data.finish_location)).addTo(layer);
    data.fuel_stops.forEach((stop, i) => {
      L.marker([stop.latitude, stop.longitude]).bindPopup(
        `<b>${i + 1}. ${esc(stop.station_name)}</b><br>${esc(stop.address)}, ${esc(stop.city)}, ${esc(stop.state)}<br>` +
        `$${stop.price_per_gallon.toFixed(3)}/gal &middot; ${stop.gallons_purchased} gal &middot; ${money(stop.estimated_cost)}`
      ).addTo(layer);
    });
    map.fitBounds(line.getBounds(), { padding: [20, 20] });

    const rows = data.fuel_stops.map((s, i) => `
      <tr><td>${i + 1}</td>
          <td>${esc(s.station_name)}<br><span class="muted">${esc(s.city)}, ${esc(s.state)} &middot; mile ${s.distance_from_start_miles}</span></td>
          <td class="num">$${s.price_per_gallon.toFixed(3)}</td>
          <td class="num">${s.gallons_purchased}</td>
          <td class="num">${money(s.estimated_cost)}</td></tr>`).join("");
    panel.innerHTML = `
      <div class="stats">
        <div class="stat"><b>${data.distance_miles.toLocaleString()} mi</b><span>distance (${data.duration_hours} h)</span></div>
        <div class="stat"><b>${money(data.total_fuel_cost)}</b><span>total fuel cost</span></div>
        <div class="stat"><b>${data.fuel_stops.length}</b><span>fuel stops</span></div>
        <div class="stat"><b>${data.estimated_gallons} gal</b><span>fuel burned (${data.fuel_summary.gallons_purchased} bought)</span></div>
      </div>
      ${data.fuel_stops.length ? `<table><thead><tr><th>#</th><th>Station</th><th class="num">$/gal</th><th class="num">Gal</th><th class="num">Cost</th></tr></thead><tbody>${rows}</tbody></table>`
                               : `<p class="muted">No fuel stop needed: the trip fits in the starting tank.</p>`}
      <p class="muted">Routing API calls: ${data.meta.routing_api_calls} (cache hit: ${data.meta.route_cache_hit}) &middot;
        ${data.meta.candidate_stations_near_route} stations near route &middot; ${data.meta.processing_time_ms} ms</p>`;
  }

  document.getElementById("plan-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    panel.innerHTML = '<p class="muted">Planning&hellip;</p>';
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          start_location: document.getElementById("start").value,
          finish_location: document.getElementById("finish").value
        })
      });
      const data = await response.json();
      if (!response.ok) {
        const detail = data.detail || Object.entries(data).map(([k, v]) => `${k}: ${[].concat(v).join(" ")}`).join("; ");
        panel.innerHTML = `<p class="error">${response.status}: ${esc(detail)}</p>`;
        return;
      }
      render(data);
    } catch (err) {
      panel.innerHTML = `<p class="error">Request failed: ${esc(err.message)}</p>`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
